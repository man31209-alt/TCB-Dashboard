<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#05070b">
<title>TC Boiler Tool Completion</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<script>
// Phones (and ?board) go straight to the material board, exactly as before.
(function () {
  if (matchMedia('(max-width: 820px)').matches || /[?&]board(=|&|$)/.test(location.search)) {
    location.replace('board.html' + location.hash);
  }
})();
</script>
<style>
  html, body { margin: 0; height: 100%; background: #05070b; overflow: hidden; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; opacity: 0; transition: opacity .8s ease; z-index: 0; }
  iframe.on { opacity: 1; z-index: 1; }
  #dots { position: fixed; right: 14px; bottom: 10px; z-index: 5; display: flex; gap: 7px; pointer-events: none; }
  #dots i { width: 9px; height: 9px; border-radius: 50%; background: rgba(255,255,255,.22); }
  #dots i.on { background: rgba(255,255,255,.75); }
</style>
</head>
<body>
<!-- TV screens. SHOW below picks what the TV displays: 'schedule', 'board', or 'both' (take turns). -->
<iframe id="f0" title="Tool status board"></iframe>
<iframe id="f1" title="Tool completion schedule"></iframe>
<div id="dots" aria-hidden="true"><i></i><i></i></div>
<script>
(function () {
  var SHOW = 'schedule';           // 'schedule' = tool schedule only, 'board' = material board only, 'both' = take turns
  var SECONDS = [60, 60];          // when SHOW is 'both': [material board, tool schedule]
  var SRC = ['board.html', 'schedule.html?tv=1&theme=dark'];
  var frames = [document.getElementById('f0'), document.getElementById('f1')];
  var dots = document.querySelectorAll('#dots i');
  var cur = SHOW === 'schedule' ? 1 : 0;
  function show(i) {
    for (var k = 0; k < frames.length; k++) {
      frames[k].className = k === i ? 'on' : '';
      dots[k].className = k === i ? 'on' : '';
    }
  }
  function next() { cur = (cur + 1) % frames.length; show(cur); setTimeout(next, SECONDS[cur] * 1000); }
  if (SHOW === 'both') {
    frames[0].src = SRC[0]; frames[1].src = SRC[1]; show(0);
    setTimeout(next, SECONDS[0] * 1000);
  } else {
    frames[cur].src = SRC[cur]; show(cur);
    document.getElementById('dots').style.display = 'none';
  }

  // Site-change check (2026-11-07, fix for the Silk toolbar coming back). Never a full-page reload:
  //  - the version stamp is normalized (GitHub serves it in two forms, e.g. W/"abc" and "abc"; etag and last-modified are
  //    never compared with each other);
  //  - a new stamp must be seen on 2 checks in a row before anything happens;
  //  - on a confirmed change, and every 6 hours, ONLY the dashboard frame(s) are reloaded.
  var CHECK_MS = 120000, CONFIRM = 2, FRAME_RELOAD_MS = 21600000;
  var tm = /[?&]checkms=(\d+)/.exec(location.search); if (tm) CHECK_MS = Math.max(1000, +tm[1]);   // test hook (scratch tests only)
  var LOG = []; function log(e) { LOG.push(e); document.body.setAttribute('data-log', JSON.stringify(LOG.slice(-20))); }
  function norm(s) { return s ? String(s).trim().replace(/^W\//i, '').replace(/^"+|"+$/g, '').replace(/[-;]+(gzip|br|deflate)$/i, '').toLowerCase() : ''; }
  function stamp(r) { var e = norm(r.headers.get('etag')), m = norm(r.headers.get('last-modified')); return e ? 'e:' + e : (m ? 'm:' + m : ''); }
  function reloadFrames(why) {
    for (var k = 0; k < frames.length; k++) {
      if (!frames[k].getAttribute('src')) continue;
      frames[k].src = SRC[k] + (SRC[k].indexOf('?') >= 0 ? '&' : '?') + '_r=' + Date.now();
    }
    log(why);
  }
  var v = '', pending = '', seen = 0;
  function check() {
    fetch('./', { method: 'HEAD', cache: 'no-store' }).then(function (r) {
      var t = stamp(r); if (!t) return;
      if (!v) { v = t; log('baseline'); return; }
      if (t.charAt(0) !== v.charAt(0)) { log('stamp kind differs: ignored'); return; }   // etag vs last-modified: not comparable
      if (t === v) { if (pending) log('change not confirmed: ignored'); pending = ''; seen = 0; return; }
      if (t === pending) seen++; else { pending = t; seen = 1; log('new stamp seen 1'); }
      if (seen >= CONFIRM) { v = t; pending = ''; seen = 0; reloadFrames('site changed: frame reload'); }
    }).catch(function () {});
  }
  check(); setInterval(check, CHECK_MS);
  setInterval(function () { reloadFrames('6-hour frame reload'); }, FRAME_RELOAD_MS);
})();
</script>
</body>
</html>
