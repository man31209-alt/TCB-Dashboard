<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#05070b">
<title>TC Boiler Tool Completion</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<script>
// Phones (and ?board) go straight to the material board, exactly as before.
(function () {
  if (matchMedia('(max-width: 820px)').matches || /[?&]board(=|&|$)/.test(location.search)) {
    location.replace('board.html' + location.hash);
  }
})();
</script>
<style>
  html, body { margin: 0; height: 100%; background: #05070b; overflow: hidden; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; opacity: 0; transition: opacity .8s ease; z-index: 0; }
  iframe.on { opacity: 1; z-index: 1; }
  #dots { position: fixed; right: 14px; bottom: 10px; z-index: 5; display: flex; gap: 7px; pointer-events: none; }
  #dots i { width: 9px; height: 9px; border-radius: 50%; background: rgba(255,255,255,.22); }
  #dots i.on { background: rgba(255,255,255,.75); }
</style>
</head>
<body>
<!-- TV screens. SHOW below picks what the TV displays: 'schedule', 'board', or 'both' (take turns). -->
<iframe id="f0" title="Tool status board"></iframe>
<iframe id="f1" title="Tool completion schedule"></iframe>
<div id="dots" aria-hidden="true"><i></i><i></i></div>
<script>
(function () {
  var SHOW = 'schedule';           // 'schedule' = tool schedule only, 'board' = material board only, 'both' = take turns
  var SECONDS = [60, 60];          // when SHOW is 'both': [material board, tool schedule]
  var SRC = ['board.html', 'schedule.html?tv=1&theme=dark'];
  var frames = [document.getElementById('f0'), document.getElementById('f1')];
  var dots = document.querySelectorAll('#dots i');
  var cur = SHOW === 'schedule' ? 1 : 0;
  function show(i) {
    for (var k = 0; k < frames.length; k++) {
      frames[k].className = k === i ? 'on' : '';
      dots[k].className = k === i ? 'on' : '';
    }
  }
  function next() { cur = (cur + 1) % frames.length; show(cur); setTimeout(next, SECONDS[cur] * 1000); }
  if (SHOW === 'both') {
    frames[0].src = SRC[0]; frames[1].src = SRC[1]; show(0);
    setTimeout(next, SECONDS[0] * 1000);
  } else {
    frames[cur].src = SRC[cur]; show(cur);
    document.getElementById('dots').style.display = 'none';
  }

  // Reload when a new upload replaces this page (HEAD only, every 2 minutes), plus a full reload every 6 hours.
  var v = null;
  function check() {
    fetch('./', { method: 'HEAD', cache: 'no-store' }).then(function (r) {
      var t = r.headers.get('etag') || r.headers.get('last-modified');
      if (!t) return;
      if (v === null) v = t; else if (t !== v) location.reload();
    }).catch(function () {});
  }
  check(); setInterval(check, 120000);
  setTimeout(function () { location.reload(); }, 21600000);
})();
</script>
</body>
</html>
